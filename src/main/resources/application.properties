# Database configuration
quarkus.datasource.db-kind=${DB_KIND}
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}

# Hibernate ORM configuration
quarkus.hibernate-orm.schema-management.strategy=update

# JWT Configuration
mp.jwt.verify.issuer=${JWT_ISSUER:http://localhost:8080}
smallrye.jwt.new-token.issuer=${JWT_ISSUER:http://localhost:8080}

# CORS Configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, OPTIONS, POST, PUT, DELETE, PATCH